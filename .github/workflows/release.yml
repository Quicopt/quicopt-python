# SPDX-License-Identifier: Apache-2.0
# Build and publish `quicopt` to PyPI via Trusted Publishing (OIDC) — no API tokens.
#
# Release flow: bump `version` in pyproject.toml, land it on main, then publish a
# GitHub Release whose tag is `v<version>` on that commit:
#
#   gh release create v0.7.1 --target main --title "quicopt 0.7.1" --notes-file notes.md
#
# The `check` job refuses a tag that does not name the version in pyproject.toml,
# runs the tests and builds the distributions. The `publish` job runs in the
# `pypi` environment, which requires a maintainer's approval in the Actions tab
# before anything is uploaded. A published version can never be re-uploaded, so
# the approval is the last chance to stop it.
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  check:
    name: Check version, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The release tag names the version in pyproject.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match version $version in pyproject.toml (expected v$version)"
            exit 1
          fi
      - name: Test
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[pyomo,pulp,test]"
          python -m pytest tests/
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: check
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write    # the OIDC token PyPI Trusted Publishing verifies — no secrets
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
